<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheletro dell'app</title>
<!-- Scheletro dell'app nei formati 18:9, 19:9, 19.5:9 e 20:9 (turno giocatori e turno nemesi), misure in mm.
     Pagina a sé: non fa parte dell'app. Le misure sono in misure.json (stessi dati, copiati qui sotto). -->
<style>
  :root { --bg: #f4f2ed; --ink: #1d1d1f; --muted: #5f5d58; --line: #c9c5bb; --screen: #101116; --gap: #c0392b; --s: 2; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink); font: 14px/20px system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 22px; line-height: 28px; }
  .intro { max-width: 760px; margin: 0 0 16px; color: var(--muted); }
  .intro b { color: var(--ink); }
  .zoom { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  .zoom button { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  .zoom button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .formato { margin-bottom: 40px; }
  .formato h2 { margin: 0 0 12px; font-size: 18px; }
  .formato h2 small { font-weight: 400; color: var(--muted); }
  .coppia { display: flex; flex-wrap: wrap; gap: 32px; }
  .turno { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .turno h3 { width: 100%; margin: 0; font-size: 14px; }
  /* Schermo disegnato in mm (scala --s: 1 = mm veri se lo schermo è calibrato) */
  .screen { position: relative; flex: 0 0 auto; background: var(--screen); border-radius: calc(2mm * var(--s)); overflow: hidden;
    outline: 1px solid #000; }
  .box { position: absolute; border: 1px solid rgba(223, 174, 89, .9); background: rgba(223, 174, 89, .14); color: #f3e3c0;
    font: 600 9px/11px system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; overflow: hidden; padding: 1px; }
  .box span { opacity: .85; font-weight: 400; }
  .box.is-small { font-size: 0; }
  .gap { position: absolute; right: 2px; border-left: 2px solid var(--gap); }
  .gap::before, .gap::after { content: ''; position: absolute; left: -5px; width: 8px; border-top: 2px solid var(--gap); }
  .gap::before { top: 0; } .gap::after { bottom: 0; }
  /* Numero dello spazio, a sinistra della quota (lo stesso della tabella "Spazio verticale") */
  .gap-num { position: absolute; right: 10px; transform: translateY(-50%); min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px; background: var(--gap); color: #fff; font: 700 9px/14px system-ui, sans-serif; text-align: center; z-index: 2; }
  .num { display: inline-block; min-width: 18px; height: 18px; margin-right: 6px; padding: 0 4px; border-radius: 9px;
    background: var(--gap); color: #fff; font-weight: 700; font-size: 11px; line-height: 18px; text-align: center; }
  table { border-collapse: collapse; font-size: 12px; line-height: 16px; background: #fff; }
  th, td { padding: 3px 8px; border-bottom: 1px solid #e3dfd6; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #ebe7de; }
  td.spazio { color: var(--gap); font-weight: 700; }
  .tabelle { display: flex; flex-direction: column; gap: 10px; }
  .stato { margin: -8px 0 20px; padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid var(--line); max-width: 760px; }
  .stato.is-live { border-color: #2e7d4f; color: #1f5c39; }
  .stato.is-error { border-color: var(--gap); color: #8e2a20; }
  /* App vera, misurata dal vivo: fuori dallo schermo ma con le sue misure (display: none non darebbe le misure) */
  .misuratore { position: absolute; left: -10000px; top: 0; width: 360px; border: 0; visibility: hidden; }
</style>
</head>

</div>

  <button type="button" data-u="px">px</button>
  <button type="button" data-u="mm">mm</button>

const mm = v => String(v).replace('.', ',');
// Unità delle misure scritte (px o mm), scelta in alto e ricordata nel browser; il disegno resta in scala in mm
let unit = 'mm';
try { const u = localStorage.getItem('scheletri-unita'); if (u === 'px' || u === 'mm') unit = u; } catch (e) {}
const val = o => mm(o[unit]);
const box = (b, k) => mm(b[unit][k]);
document.getElementById('intro').innerHTML =
  `Larghezza dello schermo uguale per tutti i formati: <b>${mm(DATA.larghezza_mm)} mm</b>. ` +
  `L'app è stata misurata a ${DATA.larghezza_px} px CSS di larghezza, quindi 1 px = ${mm(DATA.mm_per_px)} mm. ` +
  `Ogni box è un rettangolo con nome e misure (larghezza × altezza); in rosso, a destra, gli spazi verticali tra i box ` +
  `della colonna centrale, numerati dall'alto (lo stesso numero è nella tabella "Spazio verticale"). Sotto ogni schermo la tabella con tutte le misure (x e y dall'angolo in alto a sinistra), in px o in mm come scegli qui sotto. ` +
  `Con la scala 1× i mm sono veri solo se lo schermo è calibrato (o stampando al 100%).`;
const root = document.getElementById('formati');
// Misure prese adesso dall'app vera (per formato); finché mancano si usano quelle salvate (DATA)
const LIVE = {};
// Solo il turno giocatori: il turno nemesi ha box e carta alla stessa altezza (senza i comandi sotto la carta)
const TURNI = { giocatori: 'Turno giocatori (il turno nemesi è uguale, senza i comandi sotto la carta)' };
// Formato scelto in alto (uno alla volta); si ricorda nel browser
let chosen = DATA.formati[0].formato;
try { const s = localStorage.getItem('scheletri-formato'); if (DATA.formati.some(f => f.formato === s)) chosen = s; } catch (e) {}
const pick = document.getElementById('scelta-formato');
DATA.formati.forEach(f => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.formato = f.formato;
  b.textContent = f.formato;
  b.addEventListener('click', () => {
    chosen = f.formato;
    try { localStorage.setItem('scheletri-formato', chosen); } catch (e) {}
    draw();
  });
  pick.appendChild(b);
});
function draw() {
  root.replaceChildren();
  pick.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.formato === chosen)));
  document.querySelectorAll('#scelta-unita button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === unit)));
  // Misure dal vivo (LIVE) appena pronte; prima quelle salvate nella pagina
  DATA.formati.filter(f => f.formato === chosen).map(f => LIVE[f.formato] || f).forEach(f => {
    const sec = document.createElement('section');
    sec.className = 'formato';
    sec.innerHTML = `<h2>${f.formato} <small>· schermo ${mm(f.schermo_mm.w)} × ${mm(f.schermo_mm.h)} mm (${f.schermo_px.w} × ${f.schermo_px.h} px)</small></h2>`;
    const coppia = document.createElement('div');
    coppia.className = 'coppia';
    Object.entries(TURNI).forEach(([key, title]) => {
      const t = f.turni[key];
      const wrap = document.createElement('div');
      wrap.className = 'turno';
      wrap.innerHTML = `<h3>${title}</h3>`;
      const screen = document.createElement('div');
      screen.className = 'screen';
      screen.dataset.formato = f.formato;
      screen.dataset.turno = key;
      screen.style.width = `calc(${f.schermo_mm.w}mm * var(--s))`;
      screen.style.height = `calc(${f.schermo_mm.h}mm * var(--s))`;
      const u = v => `calc(${v}mm * var(--s))`;
      Object.entries(t.box).forEach(([name, b]) => {
        const el = document.createElement('div');
        el.className = 'box' + (b.mm.h < 3 || b.mm.w < 6 ? ' is-small' : '');
        el.title = `${name}: ${box(b, 'w')} × ${box(b, 'h')} ${unit}, x ${box(b, 'x')}, y ${box(b, 'y')}`;
        Object.assign(el.style, { left: u(b.mm.x), top: u(b.mm.y), width: u(b.mm.w), height: u(b.mm.h) });
        if (name === 'Testata') { el.style.background = 'rgba(120,160,220,.12)'; el.style.borderColor = 'rgba(120,160,220,.7)'; el.style.justifyContent = 'flex-end'; }
        el.innerHTML = name === 'Testata' ? '' : `${name}<span>${box(b, 'w')} × ${box(b, 'h')}</span>`;
        screen.appendChild(el);
      });
      // Spazi numerati dall'alto (1, 2, 3...): stesso numero nel disegno e nella tabella
      t.spazi.forEach((s, i) => {
        const from = s.da === 'alto dello schermo' ? 0 : t.box[s.da].mm.y + t.box[s.da].mm.h;
        const n = i + 1;
        if (s.mm > 0) {
          const g = document.createElement('div');
          g.className = 'gap';
          g.title = `Spazio ${n}: ${s.da} → ${s.a}, ${val(s)} ${unit}`;
          Object.assign(g.style, { top: u(from), height: u(s.mm) });
          screen.appendChild(g);
        }
        const num = document.createElement('div');
        num.className = 'gap-num';
        num.textContent = n;
        // (spazio di 0 mm in cima: il numero scende un poco, per restare dentro lo schermo)
        num.style.top = u(Math.max(from + s.mm / 2, 1.4));
        screen.appendChild(num);
      });
      const tabelle = document.createElement('div');
      tabelle.className = 'tabelle';
      const rows = Object.entries(t.box).map(([n, b]) =>
        `<tr><td>${n}</td><td>${box(b, 'x')}</td><td>${box(b, 'y')}</td><td>${box(b, 'w')}</td><td>${box(b, 'h')}</td></tr>`).join('');
      const gaps = t.spazi.map((s, i) => `<tr><td><span class="num">${i + 1}</span>${s.da} → ${s.a}</td><td class="spazio">${val(s)}</td></tr>`).join('');
      tabelle.innerHTML =
        `<table><thead><tr><th>Box (${unit})</th><th>x</th><th>y</th><th>larg.</th><th>alt.</th></tr></thead><tbody>${rows}</tbody></table>` +
        `<table><thead><tr><th>Spazio verticale</th><th>${unit}</th></tr></thead><tbody>${gaps}</tbody></table>`;
      wrap.append(screen, tabelle);
      coppia.appendChild(wrap);
    });
    sec.appendChild(coppia);
    root.appendChild(sec);
  });
}
draw();
document.querySelectorAll('#scelta-unita button').forEach(b => b.addEventListener('click', () => {
  unit = b.dataset.u;
  try { localStorage.setItem('scheletri-unita', unit); } catch (e) {}
  draw();
}));
document.querySelectorAll('.zoom button[data-s]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--s', b.dataset.s);
  document.querySelectorAll('.zoom button[data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));

// L'app vera (../index.html) si apre in un iframe nascosto largo 360 px; per ogni formato l'iframe prende l'altezza
// del formato, nell'app si prepara la stessa partita di prova (7 carte, la 4a al centro della vista grande) e si
// misurano i box. L'app non salva niente: save() viene spento nell'iframe, così la partita salvata resta com'è.
// Se l'app cambia i nomi interni usati qui sotto, la misura fallisce e la pagina mostra le misure salvate.
const COLONNA = ['Testata', 'Barra della fase', 'Fascia della scritta', 'Fascia piccola 1', 'Vita Gravehold', 'Box vita/token',
  'Carta grande', 'Comandi', 'Pulsante'];
const stato = document.getElementById('stato');
function setStato(text, cls) { stato.textContent = text; stato.className = 'stato' + (cls ? ' ' + cls : ''); }

// Eseguite DENTRO l'iframe (nel suo contesto globale, con le variabili dell'app)
function preparaApp() {
  save = function () {};
  // Come su un telefono: barre di scorrimento sovrapposte, che non occupano spazio (su computer la fascia piccola
  // ne avrebbe una da 15 px e le carte risulterebbero più in alto)
  const noBars = document.createElement('style');
  noBars.textContent = '*{scrollbar-width:none !important}*::-webkit-scrollbar{display:none !important}';
  document.head.appendChild(noBars);
  const nem = nemeses.find(n => n.battle && allCards.some(c => c.category === 'Specific' && c.nemesis === n.name));
  settings = { players: 2, nemesis: nem.name, includeUpgraded: true };
  newGame();
  closeStart();
  ui.deckBuilding = false;
  ui.deckDark = false;
  app.classList.remove('is-deck-dark');
  const mins = allCards.filter(c => c.type === 'Minion' && c.hp > 0);
  const pows = allCards.filter(c => c.type === 'Power' && c.removable !== false);
  queue = [mins[0], pows[0], mins[1], pows[1], mins[2], pows[2], mins[3]].map(makeEntry);
  resolving = false;
  turn = 1;
  turnOrder = { left: ['p2', 'p2', 'nemesis', 'nemesis'], drawn: ['p1', 'p1'], round: 1, picks: {}, wild: null };
  render();
}
async function misuraApp() {
  const W = innerWidth, H = innerHeight;
  const R = e => {
    if (!e) return null;
    const r = e.getBoundingClientRect();
    const x1 = Math.max(0, r.left), x2 = Math.min(W, r.right), y1 = Math.max(0, r.top), y2 = Math.min(H, r.bottom);
    if (x2 - x1 <= 0.5 || y2 - y1 <= 0.5) return null;
    return { x: +x1.toFixed(1), y: +y1.toFixed(1), w: +(x2 - x1).toFixed(1), h: +(y2 - y1).toFixed(1) };
  };
  const settle = async () => {
    await new Promise(r => setTimeout(r, 700));
    try { document.getAnimations().forEach(a => { try { a.finish(); } catch (e) {} }); } catch (e) {}
    await new Promise(r => setTimeout(r, 120));
  };
  resolving = false; ui.isTransitioning = false; render(); await settle();
  scrollToCard(queue[3].uid, 'center'); await settle();
  let item = null;
  for (let k = 0; k < 15 && !item; k++) {
    item = document.querySelector(`.queue-slot .ae-queue-item[data-uid="${centredQueueUid()}"]`);
    if (!item) await new Promise(r => setTimeout(r, 200));
  }
  if (!item) throw new Error('carta al centro non trovata');
  const slot = item.closest('.queue-slot');
  const g = { 'Testata': R(document.querySelector('.ae-header')), 'Nome nemesi': R(document.querySelector('.ae-phase')),
    'Mazzo': R(document.querySelector('.ae-pile--deck')), 'Scarti': R(document.querySelector('.ae-pile--discard')),
    'Menu': R(document.getElementById('menu-btn')), 'Barra della fase': R(turnTrackBar), 'Fascia della scritta': R(turnTrackLabels) };
  let n = 0;
  document.querySelectorAll('.queue-view .ae-compact-rail .ae-queue-item').forEach(it => { const r = R(it); if (r) { n++; g['Fascia piccola ' + n] = r; } });
  // v254: vite di Gravehold (sinistra) e della nemesi (destra), sotto la fascia piccola
  g['Vita Gravehold'] = R(document.querySelector('.ae-lives .ae-life-box--grave'));
  g['Vita nemesi'] = R(document.querySelector('.ae-lives .ae-life-box--nemesis'));
  g['Box vita/token'] = R(item.querySelector(':scope > .ae-status-badge'));
  g['Carta grande'] = R(item.querySelector('.ae-card-art'));
  const arts = [...document.querySelectorAll('.queue-slot .ae-queue-item .ae-card-art')];
  const mi = arts.indexOf(item.querySelector('.ae-card-art'));
  if (R(arts[mi - 1])) g['Carta laterale sinistra'] = R(arts[mi - 1]);
  if (R(arts[mi + 1])) g['Carta laterale destra'] = R(arts[mi + 1]);
  g['Comandi'] = R(slot.querySelector('.queue-controls'));
  g['Pulsante'] = R(nemesisBtn);
  Object.keys(g).forEach(k => { if (!g[k]) delete g[k]; });
  return g;
}

// Misure in px dell'app → stesso formato dei dati salvati (px e mm, spazi lungo la colonna centrale)
function daPx(formato, H, px) {
  const F = DATA.mm_per_px;
  const r1 = v => Math.round(v * 10) / 10;
  const toMm = v => r1(v * DATA.larghezza_mm / DATA.larghezza_px);
  const box = {};
  Object.entries(px).forEach(([k, r]) => { box[k] = { px: r, mm: { x: toMm(r.x), y: toMm(r.y), w: toMm(r.w), h: toMm(r.h) } }; });
  const spazi = [];
  let prevName = 'alto dello schermo', prevBottom = 0;
  COLONNA.filter(n => px[n]).forEach(n => {
    spazi.push({ da: prevName, a: n, px: r1(px[n].y - prevBottom), mm: toMm(px[n].y - prevBottom) });
    prevName = n; prevBottom = px[n].y + px[n].h;
  });
  spazi.push({ da: prevName, a: 'fondo dello schermo', px: r1(H - prevBottom), mm: toMm(H - prevBottom) });
  return { formato, schermo_px: { w: DATA.larghezza_px, h: H }, schermo_mm: { w: DATA.larghezza_mm, h: toMm(H) },
    turni: { giocatori: { box, spazi } } };
}

async function misuraDalVivo() {
  let version = '';
  try { version = (await (await fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v; } catch (e) {}
  setStato(`Misuro l'app${version ? ' v' + version : ''} dal vivo… (finché non ho finito vedi le misure salvate)`);
  const frame = document.createElement('iframe');
  frame.className = 'misuratore';
  frame.setAttribute('aria-hidden', 'true');
  frame.tabIndex = -1;
  frame.style.height = DATA.formati[0].schermo_px.h + 'px';
  frame.src = '../index.html?scheletro=1';
  document.body.appendChild(frame);
  try {
    await new Promise((res, rej) => { frame.onload = res; frame.onerror = rej; });
    const win = frame.contentWindow;
    const ready = () => { try { return win.eval('typeof deckSetup !== "undefined" && !!deckSetup && allCards.length > 0 && typeof makeEntry === "function"'); } catch (e) { return false; } };
    for (let i = 0; i < 100 && !ready(); i++) await new Promise(r => setTimeout(r, 150));
    if (!ready()) throw new Error("l'app non si è caricata");
    win.eval('(' + preparaApp.toString() + ')')();
    const misura = win.eval('(' + misuraApp.toString() + ')');
    // Prima il formato scelto, poi gli altri
    const ordine = [...DATA.formati].sort((a, b) => (a.formato === chosen ? -1 : 0) - (b.formato === chosen ? -1 : 0));
    for (const f of ordine) {
      const H = f.schermo_px.h;
      frame.style.height = H + 'px';
      await new Promise(r => setTimeout(r, 400));
      win.dispatchEvent(new win.Event('resize'));
      const px = await misura();
      LIVE[f.formato] = daPx(f.formato, H, px);
      if (f.formato === chosen) draw();
    }
    setStato(`Misure prese adesso dall'app${version ? ' v' + version : ''}: si aggiornano da sole a ogni modifica dell'app.`, 'is-live');
    draw();
  } catch (err) {
    setStato(`Non riesco a misurare l'app dal vivo (${err && err.message ? err.message : err}): vedi le misure salvate il 23/11/2026 (v258).`, 'is-error');
  } finally {
    frame.remove();
  }
}
misuraDalVivo();
</script>
